<svg width="600" height="900" viewBox="0 0 600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="300" y1="0" x2="300" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060B22"/>
      <stop offset="0.55" stop-color="#0B1235"/>
      <stop offset="1" stop-color="#05060D"/>
    </linearGradient>
    <linearGradient id="sun" x1="300" y1="190" x2="300" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="horizon" x1="300" y1="500" x2="300" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <clipPath id="sunClip">
      <circle cx="300" cy="330" r="140"/>
    </clipPath>
  </defs>

  <rect width="600" height="900" fill="url(#sky)"/>
  <circle cx="300" cy="330" r="170" fill="#F59E0B" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="300" cy="330" r="140" fill="url(#sun)"/>

  <g clip-path="url(#sunClip)">
    <rect x="150" y="366" width="300" height="8" fill="#0B1235"/>
    <rect x="150" y="392" width="300" height="12" fill="#0B1235"/>
    <rect x="150" y="426" width="300" height="16" fill="#0B1235"/>
    <rect x="150" y="464" width="300" height="22" fill="#0B1235"/>
  </g>

  <rect y="500" width="600" height="400" fill="url(#horizon)"/>
  <path d="M0 610L600 610" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M300 610L80 900M300 610L190 900M300 610L410 900M300 610L520 900" stroke="#F59E0B" stroke-opacity="0.22" stroke-width="2"/>
  <path d="M0 660H600M0 724H600M0 808H600" stroke="#F59E0B" stroke-opacity="0.12" stroke-width="2"/>

  <g fill="#FDE68A">
    <circle cx="94" cy="146" r="2"/>
    <circle cx="154" cy="92" r="1.5"/>
    <circle cx="462" cy="130" r="2"/>
    <circle cx="520" cy="212" r="1.5"/>
    <circle cx="418" cy="70" r="1"/>
    <circle cx="202" cy="198" r="1"/>
  </g>

  <text x="48" y="780" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" letter-spacing="4">NEON</text>
  <text x="48" y="838" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" letter-spacing="4">HORIZON</text>
  <text x="50" y="872" fill="#F59E0B" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="5">BEYOND THE SIGNAL</text>
</svg>
